name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conecta
          POSTGRES_PASSWORD: conecta_dev
          POSTGRES_DB: conecta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conecta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://conecta:conecta_dev@localhost:5432/conecta_test
      TEST_DATABASE_URL: postgresql://conecta:conecta_dev@localhost:5432/conecta_test
      E2E_DATABASE_URL: postgresql://conecta:conecta_dev@localhost:5432/conecta_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: PGPASSWORD=conecta_dev createdb -h localhost -U conecta conecta_e2e_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
